name: Check UI conventions

on:
    pull_request:
        paths:
            - "src/**"
            - "scripts/check-ui-conventions.mjs"
            - "scripts/ui-baseline.json"
            - "scripts/lib/**"
            - "package.json"
            - ".github/workflows/check-ui.yml"

permissions:
    contents: read

jobs:
    check-ui:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Reject emoji icons and hardcoded Chinese in settings & panels
              run: npm run check:ui
