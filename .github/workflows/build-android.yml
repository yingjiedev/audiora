name: Build Android APK

on:
    workflow_dispatch:
        inputs:
            version:
                description: 'Version to build (e.g., v0.6.48)'
                required: true
                default: 'v0.2.0'
                type: string
    push:
        tags:
            - 'v*'

permissions:
    contents: write
    pull-requests: read

jobs:
    build-android:
        runs-on: ubuntu-latest
        env:
            # 发布证书指纹是公开信息；固定在代码中可防止 Actions secret 被误配为其他证书。
            EXPECTED_RELEASE_CERT_SHA256: '43310e86c2f8e0d8a54e276994ca277437371c7af71bbf79efa916263361f9f9'

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            # 🚀 Node.js 设置
            - name: Setup Node.js with built-in caching
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'
                  cache-dependency-path: 'package-lock.json'

            # ☕ Java 工具链设置
            - name: Setup Java with caching
              uses: actions/setup-java@v4
              with:
                  distribution: 'temurin'
                  java-version: '17'

            # 📱 Android SDK 设置
            - name: Setup Android SDK with caching
              uses: android-actions/setup-android@v3

            - name: Cache Android SDK
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.android/sdk
                      ~/.android/avd/*.ini
                      ~/.android/avd/*/snapshots
                  key: ${{ runner.os }}-android-sdk-${{ hashFiles('android/app/build.gradle', 'android/build.gradle') }}
                  restore-keys: |
                      ${{ runner.os }}-android-sdk-

            # 🎯 Gradle 构建缓存
            - name: Cache Gradle
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.gradle/caches
                      ~/.gradle/wrapper
                      ~/.gradle/daemon
                      android/.gradle
                  key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
                  restore-keys: |
                      ${{ runner.os }}-gradle-

            # 🚄 Metro Bundler 缓存
            - name: Cache Metro Bundler
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.metro
                      node_modules/.cache/metro
                      android/app/build/generated/res/react
                  key: ${{ runner.os }}-metro-${{ hashFiles('metro.config.js', 'babel.config.js', 'package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-metro-${{ hashFiles('metro.config.js', 'babel.config.js') }}-
                      ${{ runner.os }}-metro-

            # 📦 安装依赖
            - name: Install dependencies with cache optimization
              run: |
                  # 使用npm ci进行更快的安装
                  npm ci --legacy-peer-deps --prefer-offline --no-audit --progress=false

            # 🔤 把 assets/fonts 拷进 android（gradle 不会自动做，缺了这步字体进不了 APK）
            # 直接 cp：npx react-native asset 子命令在当前 CLI 不存在，react-native-asset 又不在依赖里
            - name: Link font assets
              run: |
                  mkdir -p android/app/src/main/assets/fonts
                  cp assets/fonts/*.ttf android/app/src/main/assets/fonts/

            # 🔎 发布版本必须在打 tag 前完整提交，流水线只校验、不回写主分支
            - name: Verify release version metadata
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  RELEASE_TAG: ${{ github.ref_name }}
                  REPOSITORY: ${{ github.repository }}
              run: |
                  node <<'NODE'
                  const fs = require("fs");

                  const tag = process.env.RELEASE_TAG;
                  const version = tag.replace(/^v/, "");
                  const repository = process.env.REPOSITORY;
                  const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
                  const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
                  const release = JSON.parse(fs.readFileSync("release/version.json", "utf8"));
                  const expectedDownload = `https://github.com/${repository}/releases/download/${tag}/Audiora-v${version}-arm64-v8a-release.apk`;
                  const failures = [];

                  if (pkg.version !== version) failures.push(`package.json=${pkg.version}`);
                  if (app.expo?.version !== version) failures.push(`app.json=${app.expo?.version}`);
                  if (release.version !== version) failures.push(`release/version.json=${release.version}`);
                  if (!Array.isArray(release.changeLog) || release.changeLog.length === 0) failures.push("release changeLog is empty");
                  if (JSON.stringify(release.download) !== JSON.stringify([expectedDownload])) failures.push("release download URL is inconsistent");

                  if (failures.length > 0) {
                    console.error(`Release metadata does not match ${tag}: ${failures.join(", ")}`);
                    process.exit(1);
                  }

                  console.log(`Release metadata verified for ${tag}`);
                  NODE

            # 🔨 生成构建信息
            - name: Generate build info
              id: build-info
              run: |
                  echo "📝 Generating build info..."
                  npm run generate-build-info
                  BUILD_TIME=$(node -e "console.log(require('./src/constants/buildInfo.ts').buildInfo.buildTime)")
                  echo "build-time=$BUILD_TIME" >> $GITHUB_OUTPUT
                  echo "✅ Build info generated"

            # 🔧 Gradle 权限和缓存预热
            - name: Setup Gradle with permissions and cache warmup
              run: |
                  chmod +x android/gradlew
                  # Gradle daemon预热
                  cd android && ./gradlew --version

                  # 预构建React Native依赖以避免超时
                  echo "🚀 Pre-building React Native native modules..."
                  cd android && ./gradlew :app:preBuild \
                    --build-cache \
                    --parallel \
                    --daemon \
                    --no-scan \
                    --max-workers=2 \
                    --quiet \
                    || echo "⚠️  Pre-build completed with warnings"

            # 🔐 设置签名证书：配了 secret 就用 secret。
            # tag 发版构建缺少 secret 直接失败，禁止降级为临时自签证书（issue #3）；
            # 手动触发的验证构建允许当场生成自签证书兜底。
            - name: Setup keystore
              env:
                  KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
              run: |
                  set -e

                  # Create secure temporary directory
                  TEMP_DIR=$(mktemp -d)
                  KEYSTORE_PATH="$TEMP_DIR/release.keystore"
                  KEYSTORE_PROPS="$TEMP_DIR/keystore.properties"

                  # 是否为 tag 发版构建
                  IS_RELEASE_TAG=false
                  if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
                    IS_RELEASE_TAG=true
                  fi

                  if [[ -n "$KEYSTORE_FILE" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
                    echo "🔐 使用仓库 secret 中的签名证书"
                    printf '%s' "$KEYSTORE_FILE" | base64 -d > "$KEYSTORE_PATH"
                    STORE_PASSWORD="$KEYSTORE_PASSWORD"
                    ALIAS="$KEY_ALIAS"
                    ALIAS_PASSWORD="$KEY_PASSWORD"
                    echo "SIGNING_MODE=release" >> "$GITHUB_ENV"
                  elif [[ "$IS_RELEASE_TAG" == "true" ]]; then
                    echo "❌ 正式发版构建（tag $GITHUB_REF_NAME）缺少签名 secrets：KEYSTORE_FILE / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD"
                    echo "❌ 禁止降级为临时自签证书——每次构建签名都不同，发布后用户将无法覆盖更新。"
                    exit 1
                  else
                    echo "⚠️  未配置签名 secret，改用当场生成的自签证书（仅限验证构建）"
                    echo "⚠️  自签证书与官方包签名不同，安装前必须先卸载旧版本"
                    STORE_PASSWORD="musicfree"
                    ALIAS="musicfree"
                    ALIAS_PASSWORD="musicfree"
                    echo "SIGNING_MODE=temporary" >> "$GITHUB_ENV"
                    keytool -genkeypair -v \
                      -keystore "$KEYSTORE_PATH" \
                      -storetype PKCS12 \
                      -alias "$ALIAS" \
                      -keyalg RSA \
                      -keysize 2048 \
                      -validity 10950 \
                      -storepass "$STORE_PASSWORD" \
                      -keypass "$ALIAS_PASSWORD" \
                      -dname "CN=Audiora, OU=Fork, O=Audiora, L=NA, ST=NA, C=CN"
                  fi

                  # Create keystore.properties file in temp directory
                  cat > "$KEYSTORE_PROPS" << EOF
                  RELEASE_STORE_FILE=release.keystore
                  RELEASE_STORE_PASSWORD=$STORE_PASSWORD
                  RELEASE_KEY_ALIAS=$ALIAS
                  RELEASE_KEY_PASSWORD=$ALIAS_PASSWORD
                  EOF

                  # Move to android directory for gradle access
                  mv "$KEYSTORE_PATH" android/app/release.keystore
                  mv "$KEYSTORE_PROPS" android/keystore.properties

                  # Set restrictive permissions
                  chmod 600 android/app/release.keystore
                  chmod 600 android/keystore.properties

                  echo "🔐 Keystore configured securely"

            # 🚀 构建 Android APK
            - name: Build Android APK
              timeout-minutes: 45
              run: |
                  cd android

                  echo "📱 Starting Android APK build..."

                  # Pre-build validation
                  if [[ ! -f "keystore.properties" ]]; then
                    echo "❌ ERROR: keystore.properties not found!"
                    exit 1
                  fi

                  if [[ ! -f "app/release.keystore" ]]; then
                    echo "❌ ERROR: release.keystore not found!"
                    exit 1
                  fi

                  # Build with comprehensive error handling
                  set +e  # Don't exit immediately on error so we can capture logs

                  # 只编 arm64 单架构（不产 universal 包），全架构构建约需 30 分钟，
                  # 单架构 + Gradle 缓存命中时约 10 分钟；改回全量删掉 -PbuildAbi 参数即可
                  ./gradlew assembleRelease \
                    -PbuildAbi=arm64-v8a \
                    --build-cache \
                    --parallel \
                    --daemon \
                    --no-scan \
                    --stacktrace \
                    --max-workers=3 \
                    2>&1 | tee build.log

                  BUILD_EXIT_CODE=${PIPESTATUS[0]}

                  # Check if build failed
                  if [ $BUILD_EXIT_CODE -ne 0 ]; then
                    echo "❌ Gradle build failed with exit code $BUILD_EXIT_CODE!"
                    echo "=============== EXTRACTING ERROR DETAILS ==============="
                    # Extract Kotlin compilation errors
                    echo "--- Searching for Kotlin errors (e:) ---"
                    grep -E "^e: " build.log || echo "No 'e:' errors found"
                    echo ""
                    echo "--- Searching for compilation failures ---"
                    grep -B 5 -A 10 "compileReleaseKotlin" build.log | grep -E "e: |error:|FAILED" || echo "No compilation errors found"
                    echo ""
                    echo "--- Last 100 lines with 'error' keyword ---"
                    tail -100 build.log | grep -i "error" || echo "No error keyword found"
                    echo "========================================================="
                    exit $BUILD_EXIT_CODE
                  fi

                  echo "✅ Android APK build completed successfully"

                  # Post-build verification
                  APK_DIR="app/build/outputs/apk/release"
                  echo "📦 Verifying build outputs in $APK_DIR..."

                  if [[ ! -d "$APK_DIR" ]]; then
                    echo "❌ ERROR: APK output directory not found!"
                    exit 1
                  fi

                  APK_COUNT=$(find "$APK_DIR" -name "*.apk" | wc -l)
                  echo "🎯 Found $APK_COUNT APK files"

                  if [[ $APK_COUNT -eq 0 ]]; then
                    echo "❌ ERROR: No APK files were generated!"
                    exit 1
                  fi

                  # List all generated APKs with sizes
                  echo "📋 Generated APK files:"
                  find "$APK_DIR" -name "*.apk" -exec ls -lh {} \;
              env:
                  # Gradle优化环境变量
                  GRADLE_OPTS: '-Dorg.gradle.jvmargs=-Xmx4g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8'
                  ANDROID_COMPILE_SDK: '34'
                  ANDROID_BUILD_TOOLS: '34.0.0'
                  ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}

            # 🔍 产物签名校验：任何 Release APK 都不得使用仓库内 debug.keystore 签名（issue #3）
            - name: Verify APK signing
              run: |
                  set -euo pipefail
                  APK_DIR="android/app/build/outputs/apk/release"

                  IS_RELEASE_TAG=false
                  if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
                    IS_RELEASE_TAG=true
                  fi

                  # debug.keystore 在仓库内，其证书指纹是固定值
                  if ! DEBUG_FINGERPRINT=$(keytool -list -v \
                    -keystore android/app/debug.keystore \
                    -storepass android -alias androiddebugkey 2>/dev/null \
                    | grep "SHA256:" | head -n 1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ': ' | tr 'A-F' 'a-f'); then
                    echo "❌ 无法读取 android/app/debug.keystore 的证书指纹，校验无法进行"
                    exit 1
                  fi

                  if [[ -z "$DEBUG_FINGERPRINT" ]]; then
                    echo "❌ 无法读取 android/app/debug.keystore 的证书指纹，校验无法进行"
                    exit 1
                  fi
                  echo "🔑 debug.keystore 指纹: $DEBUG_FINGERPRINT"

                  if ! APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner -print 2>/dev/null \
                    | sort -V | tail -n 1); then
                    echo "❌ 未找到 apksigner"
                    exit 1
                  fi
                  if [[ -z "$APKSIGNER" ]]; then
                    echo "❌ 未找到 apksigner"
                    exit 1
                  fi

                  FAILED=0
                  shopt -s nullglob
                  APKS=("$APK_DIR"/*.apk)
                  shopt -u nullglob
                  if [[ "${#APKS[@]}" -eq 0 ]]; then
                    echo "❌ 没有找到待校验的 Release APK"
                    exit 1
                  fi

                  for apk in "${APKS[@]}"; do
                    echo "🧾 $(basename "$apk")"
                    if ! CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$apk"); then
                      echo "❌ APK 签名验证失败"
                      FAILED=1
                      continue
                    fi

                    mapfile -t SIGNER_FINGERPRINTS < <(
                      printf '%s\n' "$CERT_OUTPUT" \
                        | sed -nE 's/^Signer #[0-9]+ certificate SHA-256 digest:[[:space:]]*//p' \
                        | tr -d ': ' | tr 'A-F' 'a-f'
                    )

                    if [[ "${#SIGNER_FINGERPRINTS[@]}" -eq 0 ]]; then
                      echo "❌ 无法读取签名证书指纹"
                      FAILED=1
                      continue
                    fi

                    for fingerprint in "${SIGNER_FINGERPRINTS[@]}"; do
                      echo "   signer SHA-256: $fingerprint"
                      if [[ "$fingerprint" == "$DEBUG_FINGERPRINT" ]]; then
                        echo "❌ 该 APK 使用了仓库内 debug.keystore 签名，禁止发布"
                        FAILED=1
                      fi
                    done

                    if [[ "$IS_RELEASE_TAG" == "true" || "${SIGNING_MODE:-}" == "release" ]]; then
                      if [[ "${#SIGNER_FINGERPRINTS[@]}" -ne 1 ]]; then
                        echo "❌ 正式发版 APK 必须且只能有一个签名者"
                        FAILED=1
                      elif [[ "${SIGNER_FINGERPRINTS[0]}" != "$EXPECTED_RELEASE_CERT_SHA256" ]]; then
                        echo "❌ APK 证书不是固定的 Audiora 正式发布证书"
                        echo "   expected: $EXPECTED_RELEASE_CERT_SHA256"
                        FAILED=1
                      fi
                    fi
                  done
                  if [[ "$FAILED" -ne 0 ]]; then
                    exit 1
                  fi
                  if [[ "$IS_RELEASE_TAG" == "true" || "${SIGNING_MODE:-}" == "release" ]]; then
                    echo "✅ 签名校验通过：APK 使用固定的 Audiora 正式发布证书"
                  else
                    echo "✅ 签名校验通过：验证构建未使用 debug.keystore"
                  fi

            # 📤 上传构建产物
            - name: Upload All APKs as artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: audiora-${{ github.event.inputs.version || github.ref_name }}-all-apks
                  path: android/app/build/outputs/apk/release/*.apk
                  retention-days: 30
                  compression-level: 9

            # ✅ 验证APK文件存在性
            - name: Verify APK files exist
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  echo "🔍 Checking APK files..."
                  APK_DIR="android/app/build/outputs/apk/release"
                  ls -la $APK_DIR/

                  # 从tag获取版本号（去掉v前缀）
                  TAG_VERSION="${{ github.ref_name }}"
                  VERSION=${TAG_VERSION#v}

                  # Verify expected APK files exist (只编 arm64，其他架构不再产出)
                  MISSING_FILES=()
                  EXPECTED_FILES=(
                    "Audiora-v${VERSION}-arm64-v8a-release.apk"
                  )

                  for file in "${EXPECTED_FILES[@]}"; do
                    if [[ ! -f "$APK_DIR/$file" ]]; then
                      MISSING_FILES+=("$file")
                      echo "❌ Missing: $file"
                    else
                      echo "✅ Found: $file"
                    fi
                  done

                  if [[ ${#MISSING_FILES[@]} -gt 0 ]]; then
                    echo "🚨 ERROR: ${#MISSING_FILES[@]} APK files are missing!"
                    exit 1
                  else
                    echo "🎉 All APK files are present!"
                  fi

            # 🧭 tag 尚未合入默认分支时，只发布 prerelease
            - name: Determine release channel
              id: release-channel
              if: startsWith(github.ref, 'refs/tags/')
              env:
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  git fetch --no-tags origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"

                  IS_MERGED=false
                  if git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
                    IS_MERGED=true
                  else
                    ASSOCIATED_PULLS=$(curl --fail --silent --show-error \
                      -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                      -H "Accept: application/vnd.github+json" \
                      -H "X-GitHub-Api-Version: 2022-11-28" \
                      "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
                    if jq -e --arg branch "${DEFAULT_BRANCH}" \
                      'any(.[]; .merged_at != null and .base.ref == $branch)' \
                      <<< "${ASSOCIATED_PULLS}" >/dev/null; then
                      IS_MERGED=true
                    fi
                  fi

                  if [[ "${IS_MERGED}" == "true" ]]; then
                    echo "prerelease=false" >> "$GITHUB_OUTPUT"
                    echo "name=Audiora ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
                    echo "Stable release: tagged commit is already merged into ${DEFAULT_BRANCH}."
                  else
                    echo "prerelease=true" >> "$GITHUB_OUTPUT"
                    echo "name=Audiora ${GITHUB_REF_NAME} (Prerelease)" >> "$GITHUB_OUTPUT"
                    echo "Prerelease: tagged commit has not been merged into ${DEFAULT_BRANCH}."
                  fi

            # 📝 生成Release描述
            - name: Generate Release Body
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG_VERSION="${{ github.ref_name }}"
                  VERSION=${TAG_VERSION#v}
                  if [[ "${{ steps.release-channel.outputs.prerelease }}" == "true" ]]; then
                    RELEASE_NOTICE="> [!WARNING]
                  > 此版本对应的代码尚未合入默认分支，仅供发布前验证。"
                  else
                    RELEASE_NOTICE="> [!NOTE]
                  > 此版本对应的代码已合入默认分支。"
                  fi
                  cat > release_body.md << EOF
                  ## Audiora ${{ github.ref_name }}

                  ${RELEASE_NOTICE}

                  ### 下载

                  - **arm64 (Android 64 位)**: [Audiora-v${VERSION}-arm64-v8a-release.apk](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Audiora-v${VERSION}-arm64-v8a-release.apk)

                  目前只编译 arm64 版本，其他架构有需要请提 Issue。

                  ### 更新内容

                  见 [此版本提交](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }})。
                  EOF
                  echo "✅ Release body generated"

            # 🎉 创建Release并上传所有APK
            - name: Create Release and Upload APKs
              if: startsWith(github.ref, 'refs/tags/')
              uses: softprops/action-gh-release@v1
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TZ: Asia/Shanghai
              with:
                  tag_name: ${{ github.ref_name }}
                  name: ${{ steps.release-channel.outputs.name }}
                  body_path: release_body.md
                  draft: false
                  prerelease: ${{ steps.release-channel.outputs.prerelease }}
                  files: |
                      android/app/build/outputs/apk/release/Audiora-*.apk

            # 🧹 安全清理步骤
            - name: Security cleanup
              if: always()
              run: |
                  echo "🧹 Performing security cleanup..."

                  # Remove sensitive files regardless of build outcome
                  if [[ -f "android/app/release.keystore" ]]; then
                    shred -vfz -n 3 android/app/release.keystore 2>/dev/null || rm -f android/app/release.keystore
                    echo "✅ Keystore file cleaned"
                  fi

                  if [[ -f "android/keystore.properties" ]]; then
                    shred -vfz -n 3 android/keystore.properties 2>/dev/null || rm -f android/keystore.properties
                    echo "✅ Keystore properties cleaned"
                  fi

                  # Clean any temporary keystore files
                  find . -name "*.keystore" -type f -delete 2>/dev/null || true
                  find . -name "keystore.properties" -type f -delete 2>/dev/null || true

                  echo "🔐 Security cleanup completed"
