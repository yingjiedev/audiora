name: Check theme colors

on:
    pull_request:
        paths:
            - "src/**"
            - "scripts/check-hardcoded-colors.mjs"
            - "scripts/color-baseline.json"
            - "package.json"
            - ".github/workflows/check-colors.yml"

permissions:
    contents: read

jobs:
    check-colors:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: Reject new hardcoded colors
              run: npm run check:colors
